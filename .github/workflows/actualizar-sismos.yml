name: Publicar atlas sísmico

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cloudflare collects the source independently with persistent Durable Object alarms.
# GitHub Actions only publishes changes to the static application.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-panama-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar página estática
        run: |
          mkdir -p web
          cp index.html sismos.json diagnostico.json web/
          cp -R assets web/
          touch web/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefacto web
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Publicar en GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4
