name: Actualizar y publicar atlas sísmico

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 10 minutos, evitando el minuto 0 de mayor congestión
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atlas-panama-pages
  cancel-in-progress: false

jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar tabla del Instituto de Geociencias
        id: sincronizar
        continue-on-error: true
        shell: bash
        run: |
          # Conservar el JSON anterior si la página oficial no responde.
          set -o pipefail
          python scripts/actualizar_sismos.py 2>&1 | tee actualizacion.log
      - name: Mostrar resultado de la descarga
        if: ${{ !cancelled() }}
        env:
          SYNC_OUTCOME: ${{ steps.sincronizar.outcome }}
        run: |
          python scripts/generar_diagnostico.py
          if [ "$SYNC_OUTCOME" = "success" ]; then
            echo "Descarga oficial correcta: $(jq -r .fetched_at_utc sismos.json) (UTC)." >> "$GITHUB_STEP_SUMMARY"
            echo "Registros: $(jq '.events | length' sismos.json)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::La descarga oficial falló tras los reintentos; se publicará la última copia válida.'
            echo 'La descarga oficial falló. Se conserva la última copia válida, sin cambiar su fecha de descarga.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar la última descarga en el repositorio
        run: |
          if ! git diff --quiet -- sismos.json diagnostico.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sismos.json diagnostico.json
            git commit -m "Actualizar catálogo y diagnóstico de descarga"
            git push origin HEAD:main
          fi
      - name: Preparar página estática
        run: |
          mkdir -p web
          cp index.html sismos.json diagnostico.json web/
          cp -R assets web/
          touch web/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefacto web
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Publicar en GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4
      - name: Señalar que no se consiguieron datos nuevos
        if: ${{ !cancelled() && steps.sincronizar.outcome == 'failure' }}
        run: |
          echo '::error::No se consiguieron datos oficiales nuevos. Consulte los intentos de descarga en este workflow.'
          exit 1
