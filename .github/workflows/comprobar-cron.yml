name: Prueba temporal del cron

on:
  workflow_dispatch:
  schedule:
    - cron: '9-59/10 * * * *'

permissions: {}

jobs:
  comprobar-disparador:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Registrar disparador sin consultar la fuente
        env:
          ATLAS_CRON: ${{ github.event.schedule }}
        run: |
          printf '%s\n' "Evento: $GITHUB_EVENT_NAME" "Cron recibido: ${ATLAS_CRON:-no programado}" "Actor: $GITHUB_ACTOR" "Rama: $GITHUB_REF"
          echo 'Esta prueba no descarga sismos, no escribe archivos y no publica el sitio.'
